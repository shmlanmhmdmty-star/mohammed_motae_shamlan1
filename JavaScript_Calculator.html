
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            margin: 0;
            padding: 30px 15px;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 30px;
        }

        .header p {
            color: #cbd5e1;
        }

        .calculator {
            background: #f8fafc;
            color: #1e293b;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        #display {
            width: 100%;
            height: 70px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 26px;
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            text-align: left;
            direction: ltr;
            background: #e2e8f0;
            color: #0f172a;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            padding: 18px 10px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #e2e8f0;
            color: #1e293b;
        }

        button:hover {
            transform: scale(1.04);
            background: #cbd5e1;
        }

        .operator {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .operator:hover {
            background: #bfdbfe;
        }

        .clear {
            background: #fee2e2;
            color: #dc2626;
        }

        .clear:hover {
            background: #fecaca;
        }

        .equal {
            background: #0f766e;
            color: white;
        }

        .equal:hover {
            background: #14b8a6;
        }

        .tools {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tools button {
            font-size: 15px;
            background: #7c3aed;
            color: white;
        }

        .tools button:hover {
            background: #8b5cf6;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

    </style>
</head>

<body dir="rtl">

    <div class="container">

        <div class="header">
            <h1>JavaScript Calculator</h1>
            <p>آلة حاسبة تفاعلية باستخدام JavaScript</p>
        </div>

        <div class="calculator">

            <input type="text" id="display" onkeydown="handleKeyPress(event)" placeholder="أدخل العملية..." autocomplete="off">

            <div class="buttons">

                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="promett()">Prompt</button>
                <button class="equal" onclick="calculateResult()">=</button>

            </div>

        </div>

        <div class="tools">
            <button onclick="alettт('مرحباً بك في JavaScript')">Alert</button>
            <button onclick="aaaa()">Connection</button>
        </div>

        <div class="footer">
            تطبيق عملي على الدوال وربط JavaScript مع HTML
        </div>

    </div>

    <script src="JavaScript_Calculator_Functions.js"></script>

</body>
</html>
